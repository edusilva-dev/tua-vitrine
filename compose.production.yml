name: tua-vitrine-production

services:
  db:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    image: ${APP_IMAGE:-tua-vitrine:production}
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment: &app-environment
      NODE_ENV: production
      APP_ENV: production
      APP_URL: https://${APP_DOMAIN:?Defina APP_DOMAIN}
      LOCAL_ONLY: "false"
      AUTH_MODE: session
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Defina BETTER_AUTH_SECRET}
      MAIL_TRANSPORT: smtp
      MAIL_FROM: ${MAIL_FROM:?Defina MAIL_FROM}
      SMTP_HOST: ${SMTP_HOST:?Defina SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?Defina SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Defina SMTP_PASSWORD}
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL}
      STORAGE_DIR: /data/storage
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    volumes:
      - uploads:/data/storage
    networks:
      - proxy
      - data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r = await fetch('http://127.0.0.1:3000/api/health/ready'); process.exit(r.ok ? 0 : 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?Defina ACME_EMAIL}
      APP_DOMAIN: ${APP_DOMAIN:?Defina APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - proxy
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:2020/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  migrate:
    profiles: ["tools"]
    image: ${MIGRATION_IMAGE:-tua-vitrine-migrations:production}
    build:
      context: .
      target: builder
    environment: *app-environment
    command: ["bun", "run", "db:deploy"]
    networks:
      - data
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

networks:
  proxy:
  data:
    internal: true

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
