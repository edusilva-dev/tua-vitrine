name: tua-vitrine-local
services:
  db:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tuavitrine
      POSTGRES_PASSWORD: tuavitrine_local
      POSTGRES_DB: tuavitrine
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuavitrine -d tuavitrine"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  db-data:
